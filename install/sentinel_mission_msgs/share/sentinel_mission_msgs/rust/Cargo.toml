[package]
name = "sentinel_mission_msgs"
version = "0.1.0"
edition = "2021"

[dependencies]
rosidl_runtime_rs = "0.6"
serde = { version = "1", optional = true, features = ["derive"] }
serde-big-array = { version = "0.5.1", optional = true }

# ROS Dependencies
rcl_interfaces = "*"
builtin_interfaces = "*"
sensor_msgs = "*"
std_msgs = "*"
geometry_msgs = "*"
mavros_msgs = "*"
geographic_msgs = "*"

[features]
serde = ['dep:serde', 'dep:serde-big-array', 'rosidl_runtime_rs/serde', 'rcl_interfaces/serde', 'builtin_interfaces/serde', 'sensor_msgs/serde', 'std_msgs/serde', 'geometry_msgs/serde', 'mavros_msgs/serde', 'geographic_msgs/serde']

[package.metadata.ros-env]
include = true
